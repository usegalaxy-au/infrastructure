- hosts: dev_workers
  become: true
  vars_files:
      - group_vars/all.yml
      - group_vars/dev.yml
      - group_vars/VAULT
      - group_vars/dev_slurm.yml
      - group_vars/dev_workers.yml
      - secret_group_vars/stats_server_vault
  pre_tasks:
      - name: Attach volume to instance
        include_role:
          name: attached-volumes
  roles:
      - common
      - geerlingguy.pip
      - mounts
      - galaxyproject.repos
      - galaxyproject.slurm
      - geerlingguy.docker
      - usegalaxy_eu.apptainer
      - galaxyproject.cvmfs
      - dj-wasabi.telegraf
      - acl-on-startup
      - tmp-relocation
      - clean-tmpdisk
  post_tasks:
      - name: restart munge
        systemd:
            name: munge
            state: restarted
      - name: Reload cvmfs config
        command:
          cmd: cvmfs_config reload
