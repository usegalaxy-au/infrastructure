- hosts: dev-nfs
  become: true
  vars_files:
    - group_vars/all.yml
    - group_vars/dev.yml
    - group_vars/VAULT
    - group_vars/nfs_servers.yml
    - host_vars/dev-nfs.gvl.org.au.yml
    - secret_group_vars/ssh_keys
    - secret_group_vars/stats_server_vault
  pre_tasks:
    # - name: Create nfs directories
    #   file:
    #     path: "{{ item }}"
    #     state: directory
    #   with_items: "{{ nfs_dirs }}"
  roles:
    - attached-volumes
    - common
    - geerlingguy.pip
    - geerlingguy.nfs
    - dj-wasabi.telegraf
  post_tasks:
    - name: Chown shared dirs to Galaxy user
      file:
        path: "{{ item }}"
        owner: galaxy
        group: galaxy
      with_items: "{{ nfs_dirs }}"
    - name: Reload exportfs
      command: exportfs -ra
      become: yes
      become_user: root
