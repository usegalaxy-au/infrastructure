---
grouper_user: ubuntu
grouper_dir: "/home/{{ grouper_user }}/grouper"
grouper_venv: "{{ grouper_dir }}/venv"

grouper_run_script_path: "/home/{{ grouper_user }}/run_groups.sh"
grouper_run_log_path: "/home/{{ grouper_user }}/run_groups.log"
grouper_run_args: ""

grouper_cron_minute: "0"
grouper_cron_hour: "*"
grouper_enable_cron_jobs: false  # cron entry is created disabled by default

# Secrets, sourced from ansible-vault. Declared here (rather than only in
# templates/env.j2) so that role consumers can see which vault vars this
# role expects to be defined.
grouper_staging_galaxy_api_key: "{{ vault_jenkins_bot_staging_api_key }}"
grouper_prod_galaxy_api_key: "{{ vault_jenkins_bot_production_api_key }}"
grouper_slack_token: "{{ vault_galaxy_australia_slack_api_token }}"
