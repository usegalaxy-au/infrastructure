# Keys and shares

create_ssh_key: yes  # Only the first time.
ssl_country: "AU"
ssl_state: "VIC"
ssl_location: "Melbourne"
ssl_organisation: "Galaxy Australia"
ssl_operational_unit: "Pulsar Staging"
ssl_email: "help@genome.edu.au"

#host specific pulsar settings

rabbitmq_password_galaxy_au: "{{ vault_rabbitmq_password_galaxy_au_staging }}"
pulsar_queue_url: "staging-queue.gvl.org.au"
pulsar_rabbit_username: "galaxy_au"
pulsar_rabbit_vhost: "/pulsar/galaxy_au"

auth_key_user: ubuntu

# SLURM
slurm_nodes:
    - name: staging-pulsar
      NodeAddr: "{{ hostvars['staging-pulsar']['ansible_ssh_host'] }}"
      CPUs: 4
      RealMemory: 7780
      State: UNKNOWN

slurm_partitions:
    - name: main
      nodes: "staging-pulsar"
      Default: YES
      MaxTime: '30-00:00:00'
      State: UP

slurm_controller_host: staging-pulsar

slurm_munge_key: files/keys/munge.key
